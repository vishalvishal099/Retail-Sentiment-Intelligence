# Pipeline Configuration — Retail Sentiment Intelligence

pipeline:
  name: "retail_sentiment_intelligence"
  version: "0.1.0"

ingestion:
  # Source provider:
  #   arctic_shift -> free public API, no Reddit credentials needed (default)
  #   praw         -> official Reddit API, requires REDDIT_CLIENT_ID + REDDIT_CLIENT_SECRET
  fetcher_provider: "arctic_shift"
  interval_minutes: 60  # configurable, no hard dependency
  backfill_days: 90
  subreddits_file: "data/subreddits_clean.csv"
  max_comments_per_post: 10
  comment_min_score: 3
  comment_max_depth: 2
  english_only: true

storage:
  provider: "cosmos"  # "cosmos" | "sqlite" (local dev)
  cosmos:
    database: "retail_sentiment"
    containers:
      raw_posts: "raw_posts"
      analyses: "analyses"
      aggregates: "aggregates"
      feedback: "feedback"
  sqlite:
    path: "data/local.db"

llm:
  # Sentiment + reply drafting. Local-first; cloud requires keys.
  provider: "llm_gateway"  # "huggingface" | "ollama" | "openai" | "azure_openai" | "llm_gateway"
  model: "cardiffnlp/twitter-roberta-base-sentiment-latest"
  # Walmart LLM Gateway — used when provider: "llm_gateway"
  # Sentiment stays on local HF model; gateway is used only for trust credibility scoring.
  # Key supplied via WMT_LLM_GATEWAY_KEY env var (never committed to YAML).
  wmt_gateway_url: "https://wmtllmgateway.stage.walmart.com/wmtllmgateway/v1"
  wmt_gateway_model: "gpt-4o"
  # Ollama settings — used when provider: "ollama" (mater spec calls for llama3.1:8b;
  # mistral:7b-instruct works out of the box if you only have that pulled).
  ollama_url: "http://localhost:11434"
  ollama_model: "mistral:7b-instruct"
  ollama_keep_alive: "10m"
  ollama_request_timeout: 60
  batch_size: 200
  max_retries: 3
  timeout_seconds: 30
  # Cost tracking (required per R3.3)
  cost_tracking:
    enabled: true
    log_file: "data/llm_costs.jsonl"
    daily_limit_usd: 0.0  # 0 = no limit (free model)

trust:
  threshold: 0.5            # legacy hard cutoff on raw trust_score (still used by /api/trust-stats)
  gate_formula: "score_x_confidence"  # "legacy" (trust_score >= threshold) | "score_x_confidence"
  gate_tau: 0.30            # used when gate_formula = score_x_confidence: trust_score * sentiment_confidence >= tau
  weights:
    metadata: 0.4
    dedup: 0.3
    llm: 0.3
  metadata_weights:
    age: 0.20
    karma: 0.20
    length: 0.30
    engagement: 0.15
    base: 0.15            # floor so brand-new accounts with short posts can still cross gate
  low_trust_action: "flag"  # "flag" (not "drop") per R5

analysis:
  sentiment_classes: ["positive", "negative", "neutral"]
  aspects:
    - delivery
    - product_quality
    - returns
    - customer_support
    - pricing
    - app_website
  confidence_threshold: 0.7
  multi_aspect: true

privacy:
  hash_usernames: true
  retention_days: 365

dashboard:
  host: "0.0.0.0"
  port: 8000
  websocket_enabled: true
  auth: "none"  # "none" | "bearer" | "azure_ad"

# ─── Phase 3: Reddit OAuth (live reply posting) ─────────────────────────────
# dry_run: true keeps the system safe — drafts are logged, never posted to
# Reddit. Flip to false once client_id + client_secret are populated. Secrets
# are best supplied via env vars (REDDIT_OAUTH_CLIENT_ID / REDDIT_OAUTH_CLIENT_SECRET)
# rather than committed to YAML.
reddit_oauth:
  enabled: true
  dry_run: true
  client_id: ""
  client_secret: ""
  redirect_uri: "http://localhost:8000/api/auth/reddit/callback"
  user_agent: "RetailSentimentIntelligence/1.0"
  scope: "identity submit edit history"
  rate_limit_seconds: 600  # 1 reply per 10 minutes (Reddit spam filter)

# ─── Phase 4: Notifications (Slack + Email) ─────────────────────────────────
# When auto_lifecycle is true, every newly-detected negative post (with
# sentiment confidence >= confidence_threshold) is auto-inserted into the
# post_lifecycle table with state=new, and a Slack + Email alert fires.
# Each channel has its own dry_run toggle so you can test one without the other.
notifications:
  auto_lifecycle: true
  confidence_threshold: 0.7
  slack:
    enabled: false
    dry_run: true
    webhook_url: ""        # SLACK_WEBHOOK_URL env var also works
    channel: "#walmart-sentiment-alerts"
  email:
    enabled: false
    dry_run: true
    smtp_host: ""          # e.g. smtp.gmail.com  (env: SMTP_HOST)
    smtp_port: 587
    smtp_user: ""          # env: SMTP_USER
    smtp_password: ""      # env: SMTP_PASSWORD — leave blank in YAML
    use_tls: true
    from_addr: "alerts@retail-sentiment.local"
    recipients: []         # ["analyst@walmart.com", "ops@walmart.com"]
