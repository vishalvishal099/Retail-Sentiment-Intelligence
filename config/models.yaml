# =============================================================================
# Model & Tool Registry — single source of truth for what runs where.
# =============================================================================
# Each AI stage of the pipeline is configured here. To swap a model, change ONE
# line. To disable a stage, set `enabled: false`. To add a new provider, add an
# entry under `models.<stage>` and update the loader in src/utils/config.py.
#
# Loaded by src/utils/config.py and merged with pipeline_config.yaml. Anything
# defined here OVERRIDES the legacy llm:/analysis: blocks in pipeline_config.yaml
# so we can migrate piece-by-piece.
#
# Environment-variable overrides exist for every `provider` and `model` field
# (e.g. MODEL_VISION_PROVIDER, MODEL_VISION_MODEL). See loader for the full list.
# =============================================================================

models:

  # ── Stage 1 ───────────────────────────────────────────────────────────────
  # Sentiment classification — positive / negative / neutral + confidence.
  # Default is our fine-tuned ModernBERT-base (3-stage curriculum: TweetEval →
  # GoEmotions → Walmart-200 5-fold CV). Beats the cardiffnlp RoBERTa baseline
  # by +0.137 macro F1 overall and +0.722 on long posts (≥512 tokens) — see
  # docs/MODEL_COMPARISON.md. Fall back to RoBERTa if the local checkpoint is
  # missing (e.g. fresh clone before training has been run).
  sentiment:
    enabled: true
    provider: huggingface       # huggingface | ollama | openai | azure_openai
    model: models/modernbert_walmart/final
    fallback_model: cardiffnlp/twitter-roberta-base-sentiment-latest
    device: auto                # auto | cpu | mps | cuda
    max_length: 1024            # ModernBERT supports up to 8192; 1024 matches training
    confidence_threshold: 0.7   # below this → flagged needs_review

  # ── Stage 2 ───────────────────────────────────────────────────────────────
  # Aspect tagging via zero-shot NLI. DeBERTa-v3 zero-shot-v2 beats BART-MNLI
  # on virtually every aspect-extraction benchmark while being ~3× smaller.
  # See docs/VISION_MODEL_COMPARISON.md for the broader model comparison.
  aspects:
    enabled: true
    provider: huggingface
    model: MoritzLaurer/deberta-v3-base-zeroshot-v2.0
    fallback_model: facebook/bart-large-mnli   # used if main fails to load
    device: auto
    max_length: 512
    min_score: 0.30             # drop labels below this confidence
    max_per_post: 3
    multi_label: true
    candidate_labels:
      - pricing
      - product quality
      - customer service
      - store experience
      - online/app
      - delivery/pickup
      - returns
      - app_website

  # ── Stage 3 ───────────────────────────────────────────────────────────────
  # Vision captioning — runs only when a post has an image. Gemma 3 4B wins on
  # DocVQA (83 vs LLaVA-1.5's 28), runs in Ollama (same runtime as reply LLM),
  # has 128K context, and is actively maintained by Google.
  vision:
    enabled: true               # set false to disable image processing entirely
    provider: ollama
    model: gemma3:4b
    fallback_model: llava:7b    # if gemma3:4b is not pulled, try llava
    max_image_bytes: 5242880    # 5 MB cap on download
    max_image_dimension: 768    # resize so longest edge ≤ this (Pillow)
    fetch_timeout: 10           # seconds for the HTTP GET
    cache_dir: data/image_cache
    keep_alive: 10m
    request_timeout: 60
    prompt: |
      Describe this Walmart-related image in 1-3 sentences.
      If the image contains receipts, signs, prices, error messages, or other
      readable text, quote that text VERBATIM in quotes.
      Be specific about visible damage, defects, or what the customer is
      complaining about. Do not make up details that are not visible.

  # ── Stage 4 ───────────────────────────────────────────────────────────────
  # HITL reply drafter. Mistral 7B is what's already pulled; spec calls for
  # Llama 3.1 8B which is strictly better — switch with one line once pulled:
  #   ollama pull llama3.1:8b
  #   model: llama3.1:8b
  reply:
    enabled: true
    provider: ollama
    model: mistral:7b-instruct
    temperature: 0.55
    max_tokens: 220
    num_drafts: 2               # 1 LLM draft + 1 deterministic smart-composer
    keep_alive: 10m
    request_timeout: 60

  # ── Stage 5 (future) ──────────────────────────────────────────────────────
  # Semantic embeddings for the NL Copilot page. Tiny model, fast.
  embeddings:
    enabled: false
    provider: huggingface
    model: sentence-transformers/all-MiniLM-L6-v2
    device: auto

# =============================================================================
# Non-AI tools and infrastructure choices. These rarely change at runtime but
# living in one file means "what does the project use" has a single answer.
# =============================================================================

tools:

  ingestion:
    source: arctic_shift        # arctic_shift (free, no creds) | praw (Reddit API)
    interval_minutes: 60
    backfill_days: 90
    english_only: true
    min_text_chars: 10          # filter very short posts

  preprocessing:
    dedup: md5_content_hash     # md5 of normalized text
    language_detect: langdetect # statistical n-gram, not a model
    clean_urls: true
    clean_markdown: true

  storage:
    provider: sqlite            # sqlite (local) | cosmos (Azure)
    sqlite_path: data/local.db

  privacy:
    hash_usernames: true
    retention_days: 365

  trust:
    formula: score_x_confidence # score_x_confidence | legacy
    tau: 0.30
    threshold_legacy: 0.5
    low_trust_action: flag      # flag (keep + mark) | drop (do not store)
